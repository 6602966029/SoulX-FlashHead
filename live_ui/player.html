<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI数字人直播画面</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:white;font-family:"Microsoft YaHei",sans-serif}video{width:100%;height:100%;object-fit:contain}.label{position:fixed;left:5%;top:5%;z-index:10;padding:12px 20px;border:2px solid #fff9;background:#111e;color:#fff;font-size:clamp(24px,3vw,40px);font-weight:bold;border-radius:8px;pointer-events:none}#hint{position:fixed;left:10%;right:10%;top:48%;text-align:center;font-size:24px;background:#111b;padding:12px}#hint:empty{display:none}</style>
<video id="video" autoplay loop playsinline></video><div class="label">AI数字人直播</div><div id="hint">正在连接播放服务</div>
<script>const video=document.getElementById('video'),hint=document.getElementById('hint');let current=null;
async function refresh(){try{const state=await(await fetch('/api/playback',{cache:'no-store'})).json();if(!state.clip){hint.textContent='请在配置页选择预览视频';return}if(state.clip!==current){current=state.clip;video.src='/media/'+encodeURIComponent(current);video.play().then(()=>hint.textContent='').catch(()=>hint.textContent='点击画面启用声音播放')}}catch(e){hint.textContent='播放服务连接中断'}}
document.body.onclick=()=>video.play().then(()=>hint.textContent='');video.onerror=()=>hint.textContent='视频加载失败，请在配置页重新选择';refresh();setInterval(refresh,2000);</script></html>
