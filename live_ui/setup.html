<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频号直播配置</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f4f6f8;color:#17212b;max-width:900px;margin:40px auto;padding:0 24px}section{background:white;padding:24px;border-radius:12px;margin-bottom:20px}label{display:block;margin:12px 0 6px}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd2da;border-radius:6px;font-size:15px}button,a.button{display:inline-block;padding:10px 18px;margin:16px 8px 0 0;background:#175bd7;color:white;border:0;border-radius:6px;text-decoration:none;cursor:pointer}p{line-height:1.7}.notice{background:#fff3cf;padding:14px;border-radius:8px}#message{white-space:pre-wrap}.status{padding:10px;background:#eff4fa;border-radius:6px}</style>
<h1>视频号直播配置</h1><p>本机配置与 OBS 音画预览。自动讲解和视频号弹幕系统尚未接入。</p>
<section><h2>运行状态</h2><div id="status" class="status">正在检查</div><p class="notice">VB-CABLE 尚待重启后确认；视频号直播伴侣需要单独安装、扫码登录。此页面不会启动正式直播。</p><a class="button" href="http://127.0.0.1:7860" target="_blank">打开数字人生成</a><a class="button" href="/player" target="_blank">打开直播画面</a></section>
<section><h2>文字模型</h2><p>密钥只保存到本机。空白密码框代表保留已有密钥。</p><label>API 地址</label><input id="llm_base_url" value="https://api.deepseek.com"><label>模型名称</label><input id="llm_model" value="deepseek-flash"><label>API 密钥</label><input id="llm_api_key" type="password" autocomplete="new-password"><button onclick="test('llm')">保存并测试文字服务</button><p><a href="https://platform.deepseek.com" target="_blank">打开 DeepSeek 开放平台</a></p></section>
<section><h2>腾讯云语音合成</h2><label>SecretId</label><input id="tencent_secret_id" type="password" autocomplete="new-password"><label>SecretKey</label><input id="tencent_secret_key" type="password" autocomplete="new-password"><label>区域</label><input id="tts_region" value="ap-guangzhou"><label>音色 ID</label><input id="tts_voice" value="101001"><button onclick="test('tts')">保存并测试语音服务</button><audio id="audio" controls hidden></audio><p><a href="https://console.cloud.tencent.com/tts" target="_blank">打开腾讯云语音合成</a></p></section>
<section><h2>OBS 预览视频</h2><p>选择已生成视频进行音画测试。播放画面固定显示“AI数字人直播”。目前是预览循环，正式直播的讲解与问答调度另行开发。</p><select id="clips"></select><button onclick="choose()">切换预览</button><button onclick="load()">刷新视频列表</button></section>
<section><button onclick="save()">保存配置</button><p id="message"></p></section>
<script>const fields=['llm_base_url','llm_model','llm_api_key','tencent_secret_id','tencent_secret_key','tts_region','tts_voice'];const message=document.getElementById('message');
async function api(url,data){const r=await fetch(url,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.detail||'请求失败');return j}
async function load(){const s=await api('/api/status');document.getElementById('status').textContent=`Lite 模型：${s.lite_ready?'已下载':'未完成'} ｜ 文字密钥：${s.llm_configured?'已填写，需测试':'待填写'} ｜ 语音密钥：${s.tts_configured?'已填写，需测试':'待填写'} ｜ 弹幕：${s.comments}`;for(const [field,key] of [['llm_base_url','llm_base_url'],['llm_model','llm_model'],['tts_region','tts_region'],['tts_voice','tts_voice']])document.getElementById(field).value=s[key];const clips=await api('/api/clips');const select=document.getElementById('clips');select.replaceChildren(...clips.map(c=>new Option(c.name,c.name)))}
async function persist(){const data=Object.fromEntries(fields.map(f=>[f,document.getElementById(f).value]));const result=await api('/api/settings',data);for(const field of ['llm_api_key','tencent_secret_id','tencent_secret_key'])document.getElementById(field).value='';await load();return result}
async function save(){try{message.textContent=(await persist()).message}catch(e){message.textContent=e.message}}
async function test(provider){try{message.textContent='正在连接测试（会产生少量 API 用量）';await persist();const result=await api('/api/test/'+provider,{});message.textContent=result.message;if(result.audio){const audio=document.getElementById('audio');audio.hidden=false;audio.src=result.audio+'?t='+Date.now()}}catch(e){message.textContent=e.message}}
async function choose(){try{await api('/api/playback',{clip:document.getElementById('clips').value});message.textContent='预览已切换'}catch(e){message.textContent=e.message}}load().catch(e=>message.textContent=e.message);</script></html>
